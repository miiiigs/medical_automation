services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: medical_automation_n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/knowledge;/data/logs

      - POGS_USERNAME=${POGS_USERNAME}
      - POGS_PASSWORD=${POGS_PASSWORD}

      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE}

    volumes:
      - medical_automation_n8n_data:/home/node/.n8n
      - ./knowledge:/data/knowledge
      - ./logs:/data/logs

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  medical_automation_n8n_data: